# 회복 아이템 등록부 — 사용법: "<이름> <verb>" (verb 생략 시 복용).
# kind: "hp" 또는 "mp". restore: 회복량(모르면 생략).
# heal 반사와 플래너가 여기서 가장 강한 것을 골라 쓴다.

[[potion]]
name = "성수"
kind = "hp"

[[potion]]
name = "불고기피자"
keyword = "불고기"
kind = "hp"
verb = "복용"
# 피자가게(한성)에서 50원, "불고기 사". 복용으로 소비(먹어 아님). 레벨 7-15 회복 식품.

[[potion]]
name = "초보용회복약"
kind = "hp"
# 피자가게에서 100원, "회복약 사" 추정.
