# Editable knowledge the accessor reads. Hot-reloaded in place on save.

# Name aliases (KEY = parsed text, VALUE = the keyword the SERVER wants). Used two ways:
#  1. EXACT: a parsed name looked up before a command — repair '<name> 수리', attack
#     '<name> 공격', pickup. e.g. 장비 shows "기간테스의바지" but repair needs "기간".
#  2. ROW override for a hostile ENTITY: some things render as a DESCRIPTION so the
#     parser mis-reads or can't tell item-vs-mob (거울의 방: "다이아몬드 킹 카드이다",
#     "…고양이 체사네코다" mangles to "고양"). If a KEY here appears ANYWHERE in an
#     entity's line it WINS over the parser. The VALUE can be:
#        "카드"                    a keyword -> treat as a MOB, attack with it
#        ""                        empty -> skip (not a target)
#        { name="X", kind="item" } declare BOTH the name AND the kind, for when auto-
#                                  detection can't tell (kind: mob|item|readable|ambient;
#                                  non-mob kinds are never attacked). name optional.
#     First matching KEY wins, so use SPECIFIC substrings. A whole zone is taught by
#     DATA here — never hardcoded. Configure by what you SEE in the line.
[aliases]
"기간테스의바지" = "기간"
# Town/room FIXTURES that read like entities but are NOT mobs ("" = never a target).
"게시판" = ""
"안보면 역사의길 사냥함에 있어서 많은 착오가 생길지도 모릅니다 꼭 보세요 -안내판-" = { name = "안내판", kind = "fixture" }
"화려한 여인상이 조각되어 있는 분수대가 물을 뿜어 내고 있다." = { name = "분수대", kind = "fixture" }
"샤프앤스피디" = { name = "샤프앤스피디", kind = "fixture" }
# 가이아: "…이끼로 하나가득 덮힌 다 쓰러져가는 석상하나가 서 있다" — a moss-covered
# crumbling statue. The parser reads "석상하나" as a mob; it's a fixture (name 석상).
"석상" = ""
"제우스의번개" = "제우"
"니케의방패" = "니케"
"지혜의바지" = "지혜"
"플레이어제로의 썬더볼트" = "썬더볼트"
"플레이어제로의 용무신갑" = "용무신갑"
"플레이어제로의 머신바디" = "머신"
"플레이어제로의 불사의 갑옷" = "불사"
"플레이어제로의 카타나" = "카타나"
"플레이어제로의 소드브레이커" = "소드"
"플레이어제로의 청동갑투구" = "청동갑투구"
"객현국의 거불탄방패" = "거불탄"
"일군국의 사와라바지" = "사와라"
"파이들 스피어" = "파이들"
"엘프의칼" = "엘프"
"플레이어제로의 피닉스 레깅" = "피닉스"
"스튀르들뤼손의 블랙 레네게이드" = "블랙"
"스튀르들뤼손의 써클렛" = "써클렛"
"스튀르들뤼손의 순백의 플라스틱 슈츠" = "순백"
"스튀르들뤼손의 안티쇼크 타이즈" = "안티"
"스튀르들뤼손의 스파이드" = "스파이드"
"현실의자각의 블랙 레네게이드" = "블랙"
# 거울의 방 card mobs — attack by suit (KEY found in the line -> attack with VALUE):
"다이아몬드" = "다이아몬드"
"클로버"     = "클로버"
"하트"       = "하트"
"스페이드"   = "스페이드"
"목걸이"  = { name = "목걸이", kind = "item" }
"불고기피자" = "불고"
# ORDER MATTERS: first matching KEY wins (resolve_alias scans top-down), so put the
# SPECIFIC whole-sentence rules ABOVE the broad ones. The handmaiden's line LEADS with
# mood flavor ("하얀 장미에 …빨간 페인트를 칠하고 있는 시녀이다.") — the real mob is 시녀,
# but the broad "장미" below would grab it (장미 isn't in the room). Keying a distinctive
# slice of the WHOLE SENTENCE here makes it resolve to 시녀 first; the broad "장미" still
# handles rooms where a rose really is the target.
"빨간 페인트를 칠하고 있는 시녀" = { name = "시녀", kind = "mob" }
# The Queen's line leads with flavor ("기다란 채찍을 휘두르며 뾰족한 하이힐로 누군가 짓밟을
# 사람을 찾고 있는 여왕이다.") — the parser grabbed "누군" (from 누군가). The real mob is 여왕.
"짓밟을 사람을 찾고 있는 여왕" = { name = "여왕", kind = "mob" }
"아름다운 여자의 얼굴" = { name = "스핑크스", kind = "mob" }
"머라카락 한올 한올이 전부 빨간혓바닥을 낼름거리고 있는 여자" = { name = "메두사", kind = "mob" }
# The apron the maids wear is a dropped ITEM, not a mob (its line also leads with
# painting/하녀 flavor): key the whole sentence -> 앞치마, kind=item (never attacked,
# gets a 가져 button).
"하나씩 입고 있던 앞치마" = { name = "앞치마", kind = "item" }
"장미" = { name = "장미", kind = "mob" }
"운영자가 아니다.. 단지 진짜 바다의신 포세이돈일뿐이다.." = { name = "포세이돈", kind = "mob" }
"올림푸스 신에게 대항하여 싸운 기간테스인 클리티오스이다." = { name = "클리티오스", kind = "mob" }
"올림푸스 신에게 대항한 기간테스인 에피알테스이다." = { name = "에피알테스", kind = "mob" }
"저주를 피해보려 자식들을 삼켜버린 매정한 아버지 크로노스이다." = { name = "크로노스", kind = "mob" }
"올림푸스 신에 대항해 싸우던 기간테스인 엥켈라도스이다." = { name = "엥켈라도스", kind = "mob" }
"올림푸스 신들에게 대항한 기간테스인 펠로레우스이다." = { name = "펠로레우스", kind = "mob" }
"올림푸스의 신에게 대항한 기간테스족 폴리보테스이다." = { name = "폴리보테스", kind = "mob" }
"올림푸스 신에게 대항해 싸우던 기간테스인 거인 미마스이다." = { name = "미마스", kind = "mob" }
"위대한 대부이다." = { name = "대부", kind = "mob" }
# "위대한 교황이다." = { name = "교황", kind = "mob" }
"위대한 장군이다." = { name = "장군", kind = "mob" }
"세상을 모시는 마가이다." = { name = "마가", kind = "mob" }
"세상을 모시는 우가이다." = { name = "우가", kind = "mob" }
"세상을 모시는 저가이다." = { name = "저가", kind = "mob" }
"세상을 모시는 구가이다." = { name = "구가", kind = "mob" }
"세상을 모시는 양가이다." = { name = "양가", kind = "mob" }
"배달한웅의 뒤를 이은 2세 거불리한웅이다." = { name = "거불리", kind = "mob" }
"배달한웅의 뒤를 이은 1세 한웅천황이다." = { name = "한웅천황", kind = "mob" }
"양운국의 거불리한웅이 애용하시던 투구이다." = { name = "투구", kind = "item" }
"[수호] (여럿의) 푸른 망토를 두른 남자가 주변을 경계하고 있다." = { name = "남자", kind = "mob" }
"[수호] (여럿의) 하얀 망토를 두른 남자가 주변을 경계하고 있다." = { name = "남자", kind = "mob" }
"기간테스와의 전투에서 올림푸스의 신들과 함께 싸운 운명의 여신 모이라이이다." = { name = "모이라이", kind = "mob" }
